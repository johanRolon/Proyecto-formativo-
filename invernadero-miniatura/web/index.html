<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invernadero Miniatura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Invernadero Miniatura</h1>

  <section class="tarjetas">
    <div class="tarjeta">
      <h2>Temperatura</h2>
      <p><span id="temperatura">--</span> °C</p>
    </div>
    <div class="tarjeta">
      <h2>Humedad aire</h2>
      <p><span id="humedadAire">--</span> %</p>
    </div>
    <div class="tarjeta">
      <h2>Humedad suelo</h2>
      <p><span id="humedadSuelo">--</span></p>
    </div>
    <div class="tarjeta">
      <h2>Luz</h2>
      <p><span id="luz">--</span></p>
    </div>
  </section>

  <section class="controles">
    <button onclick="cambiar('bomba')">Riego</button>
    <button onclick="cambiar('ventilador')">Ventilador</button>
    <button onclick="cambiar('luz')">Luz</button>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
